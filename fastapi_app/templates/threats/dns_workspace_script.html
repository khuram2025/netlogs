<script>
(()=>{'use strict';
 const $=id=>document.getElementById(id),form=$('dn-form');
 const names=['hours','device_ip','vendor','search','domain','domain_mode','src_ip','dest_ip','qtype','response_code','event_type','transport','start','end','limit','resolved_ip','action'];
 const labels={search:'Search',device_ip:'Source',domain:'Domain',domain_mode:'Match',src_ip:'Client',dest_ip:'Resolver',qtype:'Type',response_code:'Response',event_type:'Event',transport:'Protocol',resolved_ip:'Answer',action:'Action',vendor:'Vendor'};
 const advancedNames=Object.keys(labels).filter(k=>!['search','device_ip'].includes(k));
 const eventLabels={'query-received':'Query received','response-success':'Response sent','response-failure':'Response failed','query-ignored':'Query ignored','recursive-query':'Recursive query','recursive-response':'Recursive reply','recursive-timeout':'Resolver timeout'};
 let offset=0,events=[],summary=null,busy=false,live=true,dirty=false,controller=null,anchor=new Date().toISOString(),applied=null,appliedRaw=null,focusBefore=null,selected=null,sourceBusy=false;
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const count=n=>new Intl.NumberFormat().format(n??0),date=v=>v?new Date(v).toLocaleString():'Never';
 const clock=v=>new Date(v).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
 const day=v=>new Date(v).toLocaleDateString([], {month:'short',day:'numeric'});
 const err=m=>{$('dn-error').textContent=m;$('dn-error').classList.toggle('dn-hidden',!m);};
 const rawValues=()=>Object.fromEntries(names.map(k=>[k,form.elements[k].value]));
 function advanced(open){$('dn-advanced').hidden=!open;$('dn-advanced-toggle').setAttribute('aria-expanded',String(open));}
 function custom(){const active=form.elements.hours.value==='custom';document.querySelectorAll('.dn-custom').forEach(x=>x.classList.toggle('dn-hidden',!active));form.elements.start.required=active;form.elements.end.required=active;if(active)advanced(true);}
 function values(raw){const p=new URLSearchParams();for(const [k,v] of Object.entries(raw)){if(!v)continue;if(k==='hours'&&v==='custom')continue;if(['start','end'].includes(k)){if(raw.hours!=='custom')continue;const d=new Date(v);if(!Number.isFinite(d.getTime()))throw Error('Select a valid start and end time.');p.set(k,d.toISOString());}else p.set(k,v);}return p;}
 const init=new URLSearchParams(location.search);for(const k of names){if(k!=='device_ip'&&init.has(k))form.elements[k].value=init.get(k);}if(!form.elements.hours.value)form.elements.hours.value='24';if(!form.elements.limit.value)form.elements.limit.value='50';custom();
 const summaryMedia=matchMedia('(max-width:1050px)');let summaryOpen=!summaryMedia.matches;function setSummary(open){summaryOpen=open;$('dn-body').classList.toggle('dn-show-summary',open);$('dn-body').classList.toggle('dn-hide-summary',!open);$('dn-summary-toggle').setAttribute('aria-expanded',String(open));}setSummary(summaryOpen);summaryMedia.addEventListener('change',e=>setSummary(!e.matches));
 const initialPage=Math.max(1,Math.min(201,Number.parseInt(init.get('page')||'1',10)||1));
 function optionLabel(k,v){const el=form.elements[k];return el?.tagName==='SELECT'?Array.from(el.options).find(o=>o.value===v)?.textContent||v:v;}
 function renderChips(){if(!appliedRaw)return;const active=Object.keys(labels).filter(k=>appliedRaw[k]&&(k!=='domain_mode'||(appliedRaw.domain&&appliedRaw.domain_mode!=='contains')));$('dn-chips').innerHTML=active.map(k=>`<button type="button" class="dn-chip" data-remove="${k}" title="Remove ${esc(labels[k])} filter"><span>${esc(labels[k])}: ${esc(optionLabel(k,appliedRaw[k]))}</span><b aria-hidden="true">×</b></button>`).join('')+(dirty?'<span class="dn-dirty">Unapplied changes</span>':'');$('dn-chips').classList.toggle('dn-hidden',!active.length&&!dirty);const n=active.filter(k=>advancedNames.includes(k)).length;$('dn-filter-count').textContent=n;$('dn-filter-count').classList.toggle('dn-hidden',!n);}
 function setDirty(){dirty=!!appliedRaw&&JSON.stringify(rawValues())!==JSON.stringify(appliedRaw);$('dn-apply').textContent=dirty?'Apply changes':'Apply';renderChips();}
 function restoreApplied(){if(appliedRaw)for(const [k,v] of Object.entries(appliedRaw))form.elements[k].value=v;custom();}
 function filterBy(key,value){restoreApplied();form.elements[key].value=value;if(key==='domain')form.elements.domain_mode.value='exact';refresh({apply:true});}
 function pageSize(){return Number(applied?.get('limit')||50);}
 function pageCount(){return summary?Math.max(1,Math.ceil(summary.total/pageSize())):1;}
 function accessiblePages(){return Math.min(pageCount(),Math.floor(10000/pageSize())+1);}
 function syncURL(){if(!appliedRaw)return;const p=new URLSearchParams();for(const [k,v] of Object.entries(appliedRaw))if(v)p.set(k,v);p.set('tab','dns');if(offset)p.set('page',String(Math.floor(offset/pageSize())+1));history.replaceState({},'',location.pathname+'?'+p);}
 function renderPager(){const page=Math.floor(offset/pageSize())+1,total=accessiblePages();$('dn-range').textContent=events.length?`${count(offset+1)}–${count(offset+events.length)}${summary?' of '+count(summary.total):''} events`:'0 events';$('dn-page-cap').classList.toggle('dn-hidden',pageCount()<=total);$('dn-jump').max=String(total);$('dn-jump').value=String(page);$('dn-go').disabled=busy||!summary;$('dn-jump').disabled=busy||!summary;const numbers=new Set([1,total]);for(let n=page-2;n<=page+2;n++)if(n>0&&n<=total)numbers.add(n);let previous=0;const buttons=[...numbers].sort((a,b)=>a-b).map(n=>{const gap=previous&&n-previous>1?'<span class="dn-page-ellipsis">…</span>':'';previous=n;return gap+`<button class="dn-btn" data-page="${n}" aria-label="Page ${n}" ${n===page?'aria-current="page"':''} ${busy||!summary?'disabled':''}>${n}</button>`;}).join('');$('dn-pages').innerHTML=`<button class="dn-btn" data-page="${page-1}" aria-label="Previous page" ${page<=1||busy?'disabled':''}>‹ Prev</button>${buttons}<button class="dn-btn" data-page="${page+1}" aria-label="Next page" ${page>=total||busy||!summary?'disabled':''}>Next ›</button>`;}
 function tagClass(code){return code==='NOERROR'?'ok':code==='NXDOMAIN'?'warn':code?'bad':'';}
 function renderRows(){const html=events.map((e,i)=>`<tr data-event="${i}"><td title="Event: ${esc(date(e.timestamp))}\nReceived: ${esc(date(e.received_at))}">${esc(clock(e.timestamp))}<span class="dn-sub">${esc(day(e.timestamp))}</span></td><td class="dn-domain-cell" title="${esc(e.qname)}"><button class="dn-domain-btn" data-domain="${esc(e.qname)}" title="Filter domain: ${esc(e.qname)}">${esc(e.qname||'—')}</button></td><td title="${esc(e.resolved_ip||'No IP answer in this event')}">${esc(e.resolved_ip||'—')}</td><td title="Client ${esc(e.src_ip)}:${e.src_port||0}">${esc(e.src_ip||'—')}<span class="dn-sub">${e.src_port?'Port '+esc(e.src_port):'—'}</span></td><td title="Resolver: ${esc(e.dest_ip)}:${e.dest_port||0}">${esc(e.device_name||e.device_ip)}<span class="dn-sub">${esc(e.device_ip)}</span></td><td><span class="dn-tag">${esc(e.qtype||'—')}</span></td><td><span class="dn-tag ${tagClass(e.response_code)}">${esc(e.response_code||'—')}</span></td><td title="${esc(e.event_type||e.action)}">${esc(eventLabels[e.event_type]||e.event_type||e.action||'—')}</td><td>${esc((e.transport||'').toUpperCase()||'—')}</td><td><button class="dn-btn dn-row-detail" data-detail="${i}" aria-label="Details for ${esc(e.qname)}">›</button></td></tr>`).join('');$('dn-rows').innerHTML=html||'<tr><td colspan="10" class="dn-empty"><strong>No matching DNS events</strong>Adjust the time range or clear a filter. Source health is shown in the summary.</td></tr>';$('dn-export').disabled=!events.length||busy;renderPager();}
 function ranks(items,key){const max=Math.max(...items.map(x=>x.count),1);return items.map(x=>`<button class="dn-rank" data-facet="${key}" data-value="${esc(x.value)}" title="Filter ${esc(x.value)}"><div class="dn-rank-line"><span class="dn-rank-name">${esc(x.value)}</span><span class="dn-rank-number">${count(x.count)}</span></div><div class="dn-rank-track"><span style="width:${Math.max(2,x.count/max*100).toFixed(2)}%"></span></div>${key==='domain'?`<div class="dn-rank-caption">${count(x.queries)} incoming ${x.queries===1?'request':'requests'}</div>`:''}</button>`).join('')||'<p class="dn-source-empty">No matching activity</p>';}
 function renderStats(data){summary=data.summary;for(const key of ['total','queries','domains','clients','nxdomain','failures'])$('dn-stat-'+key).textContent=count(summary[key]);for(const key of ['queries','responses','servers','nxdomain'])$('dn-over-'+key).textContent=count(summary[key]);$('dn-summary-range').textContent=optionLabel('hours',appliedRaw.hours);$('dn-top').innerHTML=ranks(data.top_domains.map(x=>({value:x.qname,count:x.count,queries:x.queries||0})),'domain');$('dn-clients').innerHTML=ranks(data.top_clients||[],'src_ip');$('dn-codes').innerHTML=ranks(data.response_codes||[],'response_code');$('dn-types').innerHTML=(data.record_types||[]).map(x=>`<button class="dn-type" data-facet="qtype" data-value="${esc(x.value)}">${esc(x.value)}<span>${count(x.count)}</span></button>`).join('')||'<p class="dn-source-empty">No matching records</p>';renderPager();}
 async function api(url,signal){const r=await fetch(url,{signal});if(r.status===401)throw Error('Your session has expired. Sign in again to view DNS activity.');let data;try{data=await r.json();}catch{throw Error('The server returned an unexpected response. Please refresh.');}if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'The request could not be completed.');return data;}
 async function refresh({apply=false,page=null,poll=false}={}){
  if(poll&&(busy||dirty))return;
  let nextRaw=appliedRaw,nextApplied=applied;if(apply||!applied){if(form.elements.hours.value==='custom'&&(!form.elements.start.value||!form.elements.end.value))advanced(true);if(!form.reportValidity())return;nextRaw=rawValues();try{nextApplied=values(nextRaw);}catch(e){err(e.message);return;}}
  if(controller)controller.abort();controller=new AbortController();const own=controller;busy=true;err('');
  if(apply||!applied){appliedRaw=nextRaw;applied=nextApplied;dirty=false;$('dn-apply').textContent='Apply';offset=0;summary=null;}
  if(page!==null)offset=(page-1)*pageSize();else{offset=0;anchor=new Date().toISOString();}
  const needStats=page===null||!summary;const p=new URLSearchParams(applied);if(!p.has('end'))p.set('end',anchor);p.set('offset',offset);
  $('dn-updated').textContent='Updating…';$('dn-results').setAttribute('aria-busy','true');$('dn-export').disabled=true;renderPager();renderChips();syncURL();
  try{const [data,stats]=await Promise.all([api('/api/dns/events?'+p,own.signal),needStats?api('/api/dns/stats?'+p,own.signal):Promise.resolve(null)]);if(controller!==own)return;events=data.events;if(stats)renderStats(stats);renderRows();$('dn-updated').textContent='Updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});if(!poll)$('dn-scroll').scrollTop=0;
  }catch(e){if(e.name!=='AbortError'&&controller===own){err(e.message);$('dn-updated').textContent='Refresh failed · retry with Refresh';events=[];summary=null;renderRows();for(const key of ['total','queries','domains','clients','nxdomain','failures'])$('dn-stat-'+key).textContent='—';for(const key of ['queries','responses','servers','nxdomain'])$('dn-over-'+key).textContent='—';for(const id of ['dn-top','dn-clients','dn-codes','dn-types'])$(id).innerHTML='<p class="dn-source-empty">Summary unavailable</p>';}}
  finally{if(controller===own){busy=false;$('dn-results').setAttribute('aria-busy','false');renderPager();$('dn-export').disabled=!events.length;}}
 }
 async function loadSources(initial=false){if(sourceBusy)return;sourceBusy=true;try{const data=await api('/api/dns/sources');const chosen=initial?(init.get('device_ip')||''):form.elements.device_ip.value;if(document.activeElement!==form.elements.device_ip){$('dn-source').innerHTML='<option value="">All source servers</option>'+data.sources.map(s=>`<option value="${esc(s.ip_address)}">${esc(s.hostname||s.ip_address)} · ${esc(s.ip_address)}</option>`).join('');if(chosen&&!data.sources.some(s=>s.ip_address===chosen))$('dn-source').insertAdjacentHTML('beforeend',`<option value="${esc(chosen)}">${esc(chosen)}</option>`);form.elements.device_ip.value=chosen;}
  $('dn-health').innerHTML=data.sources.map(s=>`<div class="dn-source-status"><div class="dn-source-top"><a href="/devices/${s.device_id}/">${esc(s.hostname||s.ip_address)}</a><span class="dn-state ${esc(s.connection_state)}">● ${esc(s.connection_state.replaceAll('-',' '))}</span></div><p class="dn-note">${esc(s.ip_address)}<br>Last received ${esc(date(s.last_log_received))}<br>Agent contact ${esc(date(s.last_seen))}</p></div>`).join('')||'<p class="dn-source-empty">No DNS sources enrolled. Add a source in Devices to begin.</p>';
 }catch{$('dn-health').innerHTML='<p class="dn-source-empty">Source health unavailable</p>';}finally{sourceBusy=false;}}
 function goPage(n){if(busy||!summary)return;const page=Math.min(accessiblePages(),Math.max(1,Number.parseInt(n,10)||1));refresh({page});}
 form.onsubmit=e=>{e.preventDefault();refresh({apply:true});};form.addEventListener('input',setDirty);form.addEventListener('change',setDirty);form.elements.hours.addEventListener('change',custom);form.elements.limit.addEventListener('change',()=>{const size=form.elements.limit.value;restoreApplied();form.elements.limit.value=size;refresh({apply:true});});
 $('dn-advanced-toggle').onclick=()=>advanced($('dn-advanced').hidden);$('dn-reset').onclick=()=>{form.reset();custom();advanced(false);refresh({apply:true});};$('dn-refresh').onclick=()=>refresh({apply:true});$('dn-live').onclick=()=>{live=!live;$('dn-live-label').textContent=live?'Live · 15s':'Live paused';$('dn-live').setAttribute('aria-pressed',String(live));};
 $('dn-chips').onclick=e=>{const b=e.target.closest('[data-remove]');if(!b)return;restoreApplied();const k=b.dataset.remove;form.elements[k].value=k==='domain_mode'?'contains':'';if(k==='domain')form.elements.domain_mode.value='contains';refresh({apply:true});};
 $('dn-pages').onclick=e=>{const b=e.target.closest('[data-page]');if(b&&!b.disabled)goPage(b.dataset.page);};$('dn-go').onclick=()=>goPage($('dn-jump').value);$('dn-jump').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();goPage(e.target.value);}};
 $('dn-sidebar').onclick=e=>{const b=e.target.closest('[data-facet]');if(b)filterBy(b.dataset.facet,b.dataset.value);};$('dn-summary-toggle').onclick=()=>setSummary(!summaryOpen);
 const fieldLabels={timestamp:'Event time',received_at:'Received at',device_name:'Source server',device_ip:'Source address',src_ip:'Client / source IP',src_port:'Source port',dest_ip:'Resolver / destination',dest_port:'Destination port',qtype:'Record type',response_code:'Response code',event_type:'Event type',event_code:'Windows event ID',transport:'Transport',resolved_ip:'Answer addresses',transaction_id:'Transaction ID',action:'Action',vendor:'Vendor',event_id:'Event ID'};
 function openDetail(i,button){selected=events[i];if(!selected)return;focusBefore=button;$('dn-detail-domain').textContent=selected.qname||'(no domain)';$('dn-fields').innerHTML=Object.entries(fieldLabels).map(([k,label])=>`<dt>${label}</dt><dd>${esc(k==='timestamp'||k==='received_at'?date(selected[k]):selected[k]===''?'—':selected[k]??'—')}</dd>`).join('');let raw=selected.raw_fields;try{raw=JSON.stringify(JSON.parse(raw),null,2);}catch{}$('dn-raw').textContent=raw||'No original fields available.';$('dn-detail-filter').disabled=!selected.qname;$('dn-detail-client').disabled=!selected.src_ip;$('dn-detail').classList.remove('dn-hidden');document.querySelectorAll('[data-event]').forEach(row=>row.classList.toggle('dn-selected',Number(row.dataset.event)===i));$('dn-close').focus();}
 function close(){$('dn-detail').classList.add('dn-hidden');document.querySelectorAll('.dn-selected').forEach(x=>x.classList.remove('dn-selected'));if(focusBefore?.isConnected)focusBefore.focus();}
 $('dn-rows').onclick=e=>{const detail=e.target.closest('[data-detail]');if(detail){openDetail(Number(detail.dataset.detail),detail);return;}const domain=e.target.closest('[data-domain]');if(domain)filterBy('domain',domain.dataset.domain);};$('dn-close').onclick=close;$('dn-detail').onclick=e=>{if(e.target===$('dn-detail'))close();};$('dn-detail-filter').onclick=()=>{const v=selected.qname;close();filterBy('domain',v);};$('dn-detail-client').onclick=()=>{const v=selected.src_ip;close();filterBy('src_ip',v);};
 document.addEventListener('keydown',e=>{if(!$('dn-detail').classList.contains('dn-hidden')){if(e.key==='Escape')close();if(e.key==='Tab'){const focusable=[...$('dn-detail').querySelectorAll('button:not(:disabled),summary')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}});
 $('dn-export').onclick=()=>{const keys=['timestamp','received_at','device_name','device_ip','src_ip','dest_ip','qname','qtype','resolved_ip','response_code','event_type','transport'];const cell=v=>'"'+String(v??'').replace(/^[=+@\-]/,"'$&").replaceAll('"','""')+'"';const text=[keys.join(','),...events.map(r=>keys.map(k=>cell(r[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='ZenShield-DNS-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
 setInterval(()=>{if(live&&!document.hidden&&!busy&&!dirty&&offset===0&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)&&$('dn-detail').classList.contains('dn-hidden'))refresh({poll:true});},15000);
 setInterval(()=>{if(!document.hidden)loadSources();},30000);
 loadSources(true).then(async()=>{await refresh({apply:true});if(initialPage>1&&summary)goPage(initialPage);});
})();
</script>
