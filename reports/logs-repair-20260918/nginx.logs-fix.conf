limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
server_tokens off;
server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
    location ~ ^/(metrics|api/docs|api/redoc|api/openapi.json)(/|$) { return 404; }
    location ~ ^/(setup|api/setup)(/|$) { return 404; }
    location = /api/health { return 404; }
    location = /auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://web:8000;
    }
    # Compress the large log viewer response; keep authentication routes unchanged.
    location = /logs/ {
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        proxy_pass http://web:8000;
    }
    location / { proxy_pass http://web:8000; }
}
